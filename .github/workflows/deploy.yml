name: Deploy to WHC

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cPanel Git pull and deploy
        run: |
          curl -s -X POST "https://srv22.swhc.ca:2083/execute/VersionControl/update" \
            -H "Authorization: cpanel gmmlmb57:${{ secrets.CPANEL_API_TOKEN }}" \
            -d "repository_root=%2Fhome%2Fgmmlmb57%2Fpublic_html" \
            --insecure
