name: Deploy to WHC

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via PHP webhook
        run: |
          curl -s -X POST "http://scellant-asphalte.ca/_deploy.php" \
            -H "X-Deploy-Token: SA_DEPLOY_2024_SECRET" \
            --max-time 40
